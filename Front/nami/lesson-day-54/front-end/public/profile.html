<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">
    <h2>Profile</h2>

    <!-- Profile Avatar -->
    <div class="avatar-container">
      <img id="profileAvatar" src="default-avatar.png" alt="Profile Avatar">
      <input type="file" id="avatarUpload" accept="image/*">
    </div>

    <!-- Profile Form -->
    <form id="profileForm">
      <label for="displayName">Display Name:</label>
      <input type="text" id="displayName" name="displayName" placeholder="Enter your display name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" readonly>

      <label for="phoneNumber">Phone Number:</label>
      <input type="tel" id="phoneNumber" name="phoneNumber" pattern="[0-9]{10}" placeholder="1234567890" required>

      <label for="bio">Bio:</label>
      <textarea id="bio" name="bio" placeholder="Write something about yourself..."></textarea>

      <button type="submit" id="saveButton">Save Changes</button>
    </form>

    <!-- User Stats -->
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-value" id="postsCount">0</div>
        <div class="stat-label">Posts</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="joinDate">-</div>
        <div class="stat-label">Joined</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lastActive">-</div>
        <div class="stat-label">Last Active</div>
      </div>
    </div>

    <!-- Logout Button -->
    <button id="logoutBtn">Logout</button>

    <!-- Message Display -->
    <div id="message" class="message"></div>
  </div>

  <script src="profile.js"></script>
</body>

</html>

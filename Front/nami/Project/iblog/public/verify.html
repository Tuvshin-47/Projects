<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Verification Code</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <h2>Enter Verification Code</h2>
        <p>A verification code has been sent to your email. Please enter the code below:</p>

        <form id="verifyForm">
            <input type="text" id="verificationCode" placeholder="Enter 6-digit code" required>
            <button type="submit">Verify</button>
        </form>

        <p id="message"></p>
        <p>Didn't receive the code? <button id="resendCode">Resend Code</button></p>
    </div>

    <script type="module" src="./js/verify.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-Up2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/register.css">
</head>

<body>
  <!-- /* iblog logo heseg */ -->
  <div class="logo">
    <div id="logoTitle">
      <img class="logoImage" src="./img/logo.svg" alt="" />
      <p>i</p>
      <p>blog</p>
    </div>
    <div id="search">
      <input class="searchInput" type="text" placeholder="Хайх" />
      <img class="searchImage" src="./img/search-normal.svg" alt="" />
    </div>
    <div id="buttonSign">
      <button>Бүртгүүлэх</button>
      <button class="signin">Нэвтрэх</button>
    </div>
  </div>
  <!-- /* register form */ -->
  <div class="parentContainer">
    <div class="childContainer">
      <p>Бүртгүүлэх</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="email">
            <input type="email" id="email" placeholder="Exmaple@gmail.com" required>
          </label>
        </div>
        <div class="form-group">
          <label for="password">
            <input type="password" id="password" placeholder="Нууц үг зохиох" required>
            <img id="hide1" type="hide" onclick="myFunction()" src="./img/hide.png" alt="">
          </label>
          <div id="passwordError" class="error"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">
            <input type="password" id="confirmPassword" placeholder="Нууц үг давтах" required>
            <img id="hide2" type="hide" onclick="myFunction()" src="./img/hide.png" alt="">
          </label>
          <div id="confirmPasswordError" class="error"></div>
        </div>
        <button type="submit" id="submit">Бүртгүүлэх</button>
      </form>
    </div>
  </div>
  <!-- contact heseg -->
  <div class="contactContainer">
    <div class="logo2">
      <div id="logoTitle">
        <img class="logoImage" src="./img/logo.svg" alt="" />
        <p>i</p>
        <p>blog</p>
      </div>
      <div class="logo3">
        <p>Write,Read,Enjoy</p>
      </div>

    </div>
    <div class="help">
      <p>Тусламж</p>
      <p>Хэрэглэх заавар</p>
      <p>Санал хүсэлт</p>
    </div>
    <div class="bidenteiHolbogdoh">
      <div>Бидэнтэй холбогдох</div>
      <div id="usingFlex">
        <img src="./img/fi_mail.svg" alt="">
        <p> info@jstemplate.net</p>
      </div>
      <div id="usingFlex">
        <img src="./img/fi_phone.svg" alt="">
        <p>+976 99112344</p>
      </div>

    </div>
  </div>

  <script type="module" src="./js/signup1.js"></script>

</body>

</html>

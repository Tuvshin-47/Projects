<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="css/profile.css" />
</head>

<body>
    <!-- logo -->
    <div class="logo">
        <div id="logoTitle">
            <img class="logoImage" src="./img/logo.svg" alt="" />
            <p>i</p>
            <p>blog</p>
        </div>
        <div id="search">
            <input class="searchInput" type="text" placeholder="Хайх" />
            <img class="searchImage" src="./img/search-normal.svg" alt="" />
        </div>
        <div id="buttonSign">
            <img src="./img/u_heart.svg" alt="">
            <div class="register">
                <button>Post</button>
                <img class="icon" src="./img/pen.png" alt="">
            </div>
            <div class=" dropdown">
                <img class="dropbtn" src="./img/u_user.svg" alt="">
                <button class="dropbtn">Профайл</button>
                <div class="dropdown-content">
                    <a href="./edit-profile.html"><img src="./img/u_user.svg" alt="">Миний мэдээлэл</a>
                    <a href="#"><img src="./img/u_heart.svg" alt="">Таалагдсан</a>
                    <a href="#" id="logoutBtn"><img src="./img/fi_log-out.svg" alt="">Гарах</a>
                </div>
            </div>
        </div>
    </div>
    <!-- profile heseg -->
    <div class="content">
        <!-- profile -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div class="profile-email" id="profileEmail"></div>
            </div>
            <div class="Statics">
                <div class="follower">
                    <p>0</p>
                    <p>Follows</p>
                </div>
                <div class="line"></div>
                <div class="followers">
                    <p>0</p>
                    <p>Followers</p>
                </div>
                <div class="line"></div>
                <div class="posts">
                    <p>0</p>
                    <p>Posts</p>
                </div>
            </div>
            <div class="edit-profile">
                <img src="./img/pen.png" alt="">
                <a href="edit-profile.html">Профайл засах</a>
            </div>
        </div>
        <div class="allandNothing">
            <!-- bugd post haragdah ystoi-->
            <div class="all">
                <p>Бүгд</p>
            </div>
            <!-- post bhgui uyd haragdana-->
            <div class="nothingInhere">
                <div>
                    <img src="./img/notes 1.png" alt="">
                    <p>Одоогоор бичвэр оруулаагүй байна!</p>
                </div>
            </div>
        </div>
    </div>
    <!-- contact heseg -->
    <div class="contactContainer">
        <div class="logo2">
            <div id="logoTitle">
                <img class="logoImage" src="./img/logo.svg" alt="" />
                <p>i</p>
                <p>blog</p>
            </div>
            <div class="logo3">
                <p>Write,Read,Enjoy</p>
            </div>
        </div>
        <div class="help">
            <p>Тусламж</p>
            <p>Хэрэглэх заавар</p>
            <p>Санал хүсэлт</p>
        </div>
        <div class="bidenteiHolbogdoh">
            <div>Бидэнтэй холбогдох</div>
            <div id="usingFlex">
                <img src="./img/fi_mail.svg" alt="" />
                <p>info@jstemplate.net</p>
            </div>
            <div id="usingFlex">
                <img src="./img/fi_phone.svg" alt="" />
                <p>+976 99112344</p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/profile.js"></script>
</body>

</html>

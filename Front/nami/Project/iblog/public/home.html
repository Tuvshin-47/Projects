        <img class="dropdown-icon" src="./img/down.svg" alt="Expand">
      </div>
      <div class="submenu">
        <a href="#">Hobby</a>
        <a href="#">Travel</a>
        <a href="#">Food & Beverage</a>
        <a href="#">Home & Decor</a>
      </div>
    </div>

    <div class="menu-item">
      <div class="menu-header">
        <a href="#" class="parent">Sport</a>

      </div>
      <div class="submenu">
        <a href="#">Soccer</a>

    <div class="menu-item">

        <a href="#">AI & Robotics</a>
        <a href="#">Cybersecurity</a>

      </div>
    </div>

    <div class="menu-item">
      <div class="menu-header">

      <div class="submenu">
        <a href="#">Movies</a>

      </div>

  <div id="float">

      <div id="search">
        <input class="searchInput" type="text" placeholder="Хайх" />
        <img class="searchImage" src="./img/search-normal.svg" alt="Search">
      </div>
      <div id="buttonSign">
        <button class="register">Бүртгүүлэх</button>
        <button class="signin">Нэвтрэх</button>
      </div>
    </div>
  </div>
  <!-- contact heseg -->
  <div id="float2">
    <div class="contactContainer">
      <div class="logo2">
        <div id="logoTitle">
          <img class="logoImage" src="./img/logo.svg" alt="" />
          <p>i</p>
          <p>blog</p>
        </div>
        <div class="logo3">
          <p>Write,Read,Enjoy</p>
        </div>
      </div>
      <div class="help">
        <p>Тусламж</p>
        <p>Хэрэглэх заавар</p>
        <p>Санал хүсэлт</p>
      </div>
      <div class="bidenteiHolbogdoh">
        <div>Бидэнтэй холбогдох</div>
        <div id="usingFlex">
          <img src="./img/fi_mail.svg" alt="" />

        </div>
        <div id="usingFlex">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Day 05 - HTML Forms</title>
    <!-- external CSS -->
     <link rel="stylesheet" href="./css/styles.css">
     
</head>
<body>
    <h1>HTML Forms</h1>

    <div>
        <form action="#">
            <div class="name-input">
                <label for="firstname">
                    First Name: 
                    <input type="text" name="firstname">
                </label>
                <br>
                <!-- lastname -->
                <label for="lastname">
                    Last Name: 
                    <input type="text" name="lastname">
                </label>
            </div>
        </form>
        
        <form action="#">
            <div class="name-input">
                <label for="email">
                    Email:
                    <!-- email -->
                     <input type="email" name="email">
                </label>
                <br>
                <label for="password">
                    Password:
                    <!-- password -->
                     <input type="password" name="password">
                     <!-- password type нь password байна. -->
                </label>
            </div>
        </form>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Pokemon List</title>
    <style>
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .pokemon-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #f9f9f9;
            transition: transform 0.2s;
        }
        
        .pokemon-card:hover {
            transform: scale(1.05);
        }
        
        .pokemon-card img {
            width: 120px;
            height: 120px;
        }
        
        .pokemon-card h3 {
            margin: 10px 0;
            text-transform: capitalize;
        }
        
        .loading {
            text-align: center;
            font-size: 24px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Покемонуудыг ачааллаж байна...</div>
    <div id="pokemonGrid" class="pokemon-grid"></div>

    <script>
        async function fetchPokemonList() {
            try {
                // Эхний URL-аас покемоны жагсаалтыг авах
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?offset=20&limit=20');
                const data = await response.json();
                
                // Бүх покемоны дэлгэрэнгүй мэдээллийг нэгэн зэрэг татах
                const pokemonPromises = data.results.map(pokemon => {
                    return fetch(pokemon.url).then(res => res.json());
                });
                
                // Promise.all ашиглан бүх хүсэлтийг хүлээх
                const pokemonDetails = await Promise.all(pokemonPromises);
                
                // ID-гаар эрэмбэлэх
                const sortedPokemon = pokemonDetails.sort((a, b) => a.id - b.id);
                
                // Ачааллах текстийг арилгах
                document.getElementById('loading').style.display = 'none';
                
                // Покемонуудыг дэлгэцэнд харуулах
                const gridElement = document.getElementById('pokemonGrid');
                sortedPokemon.forEach(pokemon => {
                    const card = document.createElement('div');
                    card.className = 'pokemon-card';
                    card.innerHTML = `
                        <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
                        <h3>${pokemon.name}</h3>
                        <p>ID: ${pokemon.id}</p>
                        <p>Өндөр: ${pokemon.height * 10}см</p>
                        <p>Жин: ${pokemon.weight / 10}кг</p>
                    `;
                    gridElement.appendChild(card);
                });
                
            } catch (error) {
                document.getElementById('loading').textContent = 'Алдаа гарлаа: ' + error.message;
            }
        }

        // Хуудас ачааллахад автоматаар ажиллуулах
        fetchPokemonList();
    </script>
</body>
</html>

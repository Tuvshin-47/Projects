<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
        }

        .overlay.open {
            display: block;
            opacity: 1;
        }

        .slide-panel {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: #f0f0f0;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .slide-panel.open {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
        }

        .checkbox-container {
            margin-top: 40px;
        }

        .checkbox-item {
            margin: 10px 0;
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <!-- Trigger button -->
    <button onclick="openPanel()">Нээх</button>

    <!-- Dark overlay -->
    <div id="overlay" class="overlay" onclick="closePanel()"></div>

    <!-- Slide Panel -->
    <div id="slidePanel" class="slide-panel">
        <button class="close-btn" onclick="closePanel()">×</button>
        <div class="checkbox-container">
            <div class="checkbox-item">
                <input type="checkbox" id="option1">
                <label for="option1">Сонголт 1</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="option2">
                <label for="option2">Сонголт 2</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="option3">
                <label for="option3">Сонголт 3</label>
            </div>
        </div>
    </div>

    <script>
        function openPanel() {
            document.getElementById('slidePanel').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }

        function closePanel() {
            document.getElementById('slidePanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
    </script>

</body>

</html>

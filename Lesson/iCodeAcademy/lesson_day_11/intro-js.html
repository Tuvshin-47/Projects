<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Day 11 - Intro into JS</title>
    <style>
        * {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        h1 {
            text-align: center;
        }

        main {
            width: 968px;
            height: 800px;
            margin: 0 auto;
            background-color: antiquewhite;
        }
    </style>
</head>
<body>
    <h1>Lesson Day 11 - Intro into JS</h1>

    <main>
        <script>
            // statement буюу энэ текстийг консоль дээр харуул
            console.log('Hello Javascript, Greetings from Nippon class.'); 
            // '  ' single quotation mark
            // "   " - double quotation mark
            // string төрөл буюу текст төрөл
            // Console log ашиглаад өөрийн тухай 3 өгүүлбэр бичээд хэвлэнэ үү
            // : - colon гэдэг 
            // ; - semicolon гэдэг
            console.log('My name is Khangaikhuu.');
            console.log('I am a software developer.');
            console.log('I love karate and programming.');

            // Alert буюу web browser дээр цонх харуулах
            alert('THis is alert message');

            // өөрсдийнхөө гэр бүлийн талаар alert харуулна уу
            alert('I have 3 sisters and brother');
            // confirm буюу ок болон cancel гэдэг цонх харуулах
            confirm('How are you?');

            // prompt буюу гарнаас утга аваад эсвэл ok, cancel гэж харуулдаг
            prompt('WHat is you name?');
        </script>
    </main>
</body>
</html>

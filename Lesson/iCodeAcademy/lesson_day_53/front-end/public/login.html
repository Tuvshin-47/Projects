<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center mb-4">Login</h1>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <div id="loginError" class="form-text text-danger"></div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-decoration-none">Need an account? Register Here!</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5avKM8aNmISsK2iUwsi5KALxS7rmVO5U",
            authDomain: "icode-385408.firebaseapp.com",
            projectId: "icode-385408",
            storageBucket: "icode-385408.firebasestorage.app",
            messagingSenderId: "820758801411",
            appId: "1:820758801411:web:264ecd81ce331dfd2bb236"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Using jQuery for DOM manipulation and event handling
        $(document).ready(function() {
            // Check if user is already logged in
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.href = "home.html";
                }
            });

            // Handle form submission with jQuery
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const email = $('#email').val();
                const password = $('#password').val();
                
                // Clear previous error messages
                $('#loginError').text('');
                
                // Sign in with email and password
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        window.location.href = "home.html";
                    })
                    .catch((e) => {
                        $('#loginError').text(e.message);
                    });
            });
        });
    </script>
</body>

</html>

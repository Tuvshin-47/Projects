<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        
        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        textarea.form-control {
            min-height: 200px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Add New Post</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="posts.html">My Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-10 col-lg-8 mx-auto form-container">
                <div class="card">
                    <div class="card-body p-4">
                        <h2 class="card-title mb-4">Create a New Post</h2>
                        <form id="postForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Post Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="">Select a category</option>
                                    <option value="technology">Technology</option>
                                    <option value="lifestyle">Lifestyle</option>
                                    <option value="travel">Travel</option>
                                    <option value="food">Food</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">Post Content</label>
                                <textarea class="form-control" id="content" required></textarea>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Create Post</button>
                            </div>
                            <div id="message" class="mt-3"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5avKM8aNmISsK2iUwsi5KALxS7rmVO5U",
            authDomain: "icode-385408.firebaseapp.com",
            projectId: "icode-385408",
            storageBucket: "icode-385408.firebasestorage.app",
            messagingSenderId: "820758801411",
            appId: "1:820758801411:web:6aae8f8ee6c82d212bb236"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                window.location.href = 'login.html';
            }
        });

        // Using jQuery for DOM manipulation and event handling
        $(document).ready(function() {
            // Handle post creation
            $('#postForm').on('submit', async function(e) {
                e.preventDefault();
                
                if (!currentUser) {
                    showMessage('Please login to create a post', 'danger');
                    return;
                }
                
                const title = $('#title').val();
                const category = $('#category').val();
                const content = $('#content').val();
                
                try {
                    await addDoc(collection(db, 'posts'), {
                        title,
                        category,
                        content,
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        createdAt: serverTimestamp()
                    });
                    
                    showMessage('Post created successfully!', 'success');
                    $('#postForm')[0].reset();
                    
                    // Redirect to posts list after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'posts.html';
                    }, 2000);
                    
                } catch (error) {
                    showMessage('Error creating post: ' + error.message, 'danger');
                }
            });
            
            // Handle logout
            $('#logoutBtn').on('click', function() {
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                }).catch((error) => {
                    console.error('Error signing out:', error);
                });
            });
            
            // Helper function to show messages
            function showMessage(message, type) {
                $('#message').html(`<div class="alert alert-${type}">${message}</div>`);
            }
        });
    </script>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 3rem;
            color: white;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .profile-card {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4285f4;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">User Profile</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="posts.html">My Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card profile-card">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div class="profile-avatar" id="profileAvatar"></div>
                            <h5 class="mt-3" id="profileEmail"></h5>
                        </div>

                        <form id="profileForm">
                            <div class="mb-3">
                                <label for="displayName" class="form-label">Display Name</label>
                                <input type="text" class="form-control" id="displayName" name="displayName">
                            </div>
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber">
                            </div>
                            <div class="mb-3">
                                <label for="bio" class="form-label">Bio</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="saveButton">
                                    <i class="bi bi-save me-2"></i>Save Profile
                                </button>
                            </div>
                        </form>

                        <div id="message" class="mt-3"></div>

                        <div class="row mt-4 pt-4 border-top">
                            <div class="col-4 text-center">
                                <div class="stat-value" id="postsCount">0</div>
                                <div class="stat-label">Posts</div>
                            </div>
                            <div class="col-4 text-center">
                                <div class="stat-value" id="joinDate">-</div>
                                <div class="stat-label">Joined</div>
                            </div>
                            <div class="col-4 text-center">
                                <div class="stat-value" id="lastActive">-</div>
                                <div class="stat-label">Last Active</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5avKM8aNmISsK2iUwsi5KALxS7rmVO5U",
            authDomain: "icode-385408.firebaseapp.com",
            projectId: "icode-385408",
            storageBucket: "icode-385408.firebasestorage.app",
            messagingSenderId: "820758801411",
            appId: "1:820758801411:web:6aae8f8ee6c82d212bb236"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Check authentication state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                displayUserInfo();
                await loadUserProfile();
                await loadUserStats();
            } else {
                window.location.href = 'login.html';
            }
        });

        function displayUserInfo() {
            $('#profileEmail').text(currentUser.email);
            $('#profileAvatar').text(currentUser.email[0].toUpperCase());
        }

        async function loadUserProfile() {
            try {
                const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    $('#displayName').val(userData.displayName || '');
                    $('#phoneNumber').val(userData.phoneNumber || '');
                    $('#bio').val(userData.bio || '');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                showMessage('Error loading profile', 'danger');
            }
        }

        async function loadUserStats() {
            try {
                // Count user's posts
                const postsQuery = query(
                    collection(db, 'posts'),
                    where('userId', '==', currentUser.uid)
                );
                const postsSnapshot = await getDocs(postsQuery);
                $('#postsCount').text(postsSnapshot.size);

                // Set join date
                const joinDate = new Date(currentUser.metadata.creationTime);
                $('#joinDate').text(joinDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }));

                // Set last active
                const lastActive = new Date(currentUser.metadata.lastSignInTime);
                $('#lastActive').text(lastActive.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Using jQuery for DOM manipulation and event handling
        $(document).ready(function() {
            // Handle form submission
            $('#profileForm').on('submit', async function(e) {
                e.preventDefault();
                
                // Disable save button and show loading state
                const $saveButton = $('#saveButton');
                $saveButton.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Saving...');
                
                try {
                    const userData = {
                        displayName: $('#displayName').val(),
                        phoneNumber: $('#phoneNumber').val(),
                        bio: $('#bio').val(),
                        updatedAt: new Date()
                    };
                    
                    await setDoc(doc(db, 'users', currentUser.uid), userData, { merge: true });
                    showMessage('Profile updated successfully!', 'success');
                } catch (error) {
                    console.error('Error updating profile:', error);
                    showMessage('Error updating profile', 'danger');
                } finally {
                    // Reset button state
                    $saveButton.prop('disabled', false).html('<i class="bi bi-save me-2"></i>Save Profile');
                }
            });
            
            // Handle logout
            $('#logoutBtn').on('click', function() {
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                }).catch((error) => {
                    console.error('Error signing out:', error);
                });
            });
        });
        
        // Helper function to show messages
        function showMessage(message, type) {
            $('#message').html(`<div class="alert alert-${type}">${message}</div>`);
            setTimeout(() => {
                $('#message').html('');
            }, 3000);
        }
    </script>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
